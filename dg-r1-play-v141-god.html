 /**
 * 
 * @class Strip
 * @extends DisplayObjectContainer
 * @constructor
 * @param texture {Texture} The texture to use
 * @param width {Number} the width 
 * @param height {Number} the height
 * 
 */
PIXI.Strip = function(texture)
{
    PIXI.DisplayObjectContainer.call( this );
    
    this.texture = texture;

    // set up the main bits..
    this.uvs = new PIXI.Float32Array([0, 1,
                                    1, 1,
                                    1, 0,
                                    0,1]);

    this.verticies = new PIXI.Float32Array([0, 0,
                      100,0,
                      100,100,
                      0, 100]);

    this.colors = new PIXI.Float32Array([1, 1, 1, 1]);

    this.indices = new PIXI.Uint16Array([0, 1, 2, 3]);
    

    this.dirty = true;
};

// constructor
PIXI.Strip.prototype = Object.create(PIXI.DisplayObjectContainer.prototype);
PIXI.Strip.prototype.constructor = PIXI.Strip;

PIXI.Strip.prototype._renderWebGL = function(renderSession)
{
    // if the sprite is not visible or the alpha is 0 then no need to render this element
    if(!this.visible || this.alpha <= 0)return;
    // render triangle strip..

    renderSession.spriteBatch.stop();

    // init! init!
    if(!this._vertexBuffer)this._initWebGL(renderSession);
    
    renderSession.shaderManager.setShader(renderSession.shaderManager.stripShader);

    this._renderStrip(renderSession);

    ///renderSession.shaderManager.activateDefaultShader();

    renderSession.spriteBatch.start();

    //TODO check culling  
};

PIXI.Strip.prototype._initWebGL = function(renderSession)
{
    // build the strip!
    var gl = renderSession.gl;
    
    this._vertexBuffer = gl.createBuffer();
    this._indexBuffer = gl.createBuffer();
    this._uvBuffer = gl.createBuffer();
    this._colorBuffer = gl.createBuffer();
    
    gl.bindBuffer(gl.ARRAY_BUFFER, this._vertexBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, this.verticies, gl.DYNAMIC_DRAW);

    gl.bindBuffer(gl.ARRAY_BUFFER, this._uvBuffer);
    gl.bufferData(gl.ARRAY_BUFFER,  this.uvs, gl.STATIC_DRAW);

    gl.bindBuffer(gl.ARRAY_BUFFER, this._colorBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, this.colors, gl.STATIC_DRAW);
 
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this._indexBuffer);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, this.indices, gl.STATIC_DRAW);
};

PIXI.Strip.prototype._renderStrip = function(renderSession)
{
    var gl = renderSession.gl;
    var projection = renderSession.projection,
        offset = renderSession.offset,
        shader = renderSession.shaderManager.stripShader;


    // gl.uniformMatrix4fv(shaderProgram.mvMatrixUniform, false, mat4Real);

    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

    // set uniforms
    gl.uniformMatrix3fv(shader.translationMatrix, false, this.worldTransform.toArray(true));
    gl.uniform2f(shader.projectionVector, projection.x, -projection.y);
    gl.uniform2f(shader.offsetVector, -offset.x, -offset.y);
    gl.uniform1f(shader.alpha, 1);

    if(!this.dirty)
    {
        
        gl.bindBuffer(gl.ARRAY_BUFFER, this._vertexBuffer);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, this.verticies);
        gl.vertexAttribPointer(shader.aVertexPosition, 2, gl.FLOAT, false, 0, 0);
        
        // update the uvs
        gl.bindBuffer(gl.ARRAY_BUFFER, this._uvBuffer);
        gl.vertexAttribPointer(shader.aTextureCoord, 2, gl.FLOAT, false, 0, 0);
            
        gl.activeTexture(gl.TEXTURE0);
         // bind the current texture
        gl.bindTexture(gl.TEXTURE_2D, this.texture.baseTexture._glTextures[gl.id] || PIXI.createWebGLTexture(this.texture.baseTexture, gl));
    
        // dont need to upload!
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this._indexBuffer);
    
    
    }
    else
    {

        this.dirty = false;
        gl.bindBuffer(gl.ARRAY_BUFFER, this._vertexBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, this.verticies, gl.STATIC_DRAW);
        gl.vertexAttribPointer(shader.aVertexPosition, 2, gl.FLOAT, false, 0, 0);
        
        // update the uvs
        gl.bindBuffer(gl.ARRAY_BUFFER, this._uvBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, this.uvs, gl.STATIC_DRAW);
        gl.vertexAttribPointer(shader.aTextureCoord, 2, gl.FLOAT, false, 0, 0);
            
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, this.texture.baseTexture._glTextures[gl.id] || PIXI.createWebGLTexture(this.texture.baseTexture, gl));
    
        // dont need to upload!
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this._indexBuffer);
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, this.indices, gl.STATIC_DRAW);
        
    }
    //console.log(gl.TRIANGLE_STRIP)
    //
    //
    gl.drawElements(gl.TRIANGLE_STRIP, this.indices.length, gl.UNSIGNED_SHORT, 0);
    
  
};

PIXI.Strip.prototype._renderCanvas = function(renderSession)
{
    var context = renderSession.context;
    
    var transform = this.worldTransform;

    if (renderSession.roundPixels)
    {
        context.setTransform(transform.a, transform.c, transform.b, transform.d, transform.tx | 0, transform.ty | 0);
    }
    else
    {
        context.setTransform(transform.a, transform.c, transform.b, transform.d, transform.tx, transform.ty);
    }
        
    var strip = this;
    // draw triangles!!
    var verticies = strip.verticies;
    var uvs = strip.uvs;

    var length = verticies.length/2;
    this.count++;

    for (var i = 0; i < length-2; i++)
    {
        // draw some triangles!
        var index = i*2;

        var x0 = verticies[index],   x1 = verticies[index+2], x2 = verticies[index+4];
        var y0 = verticies[index+1], y1 = verticies[index+3], y2 = verticies[index+5];

        if(true)
        {

            //expand();
            var centerX = (x0 + x1 + x2)/3;
            var centerY = (y0 + y1 + y2)/3;

            var normX = x0 - centerX;
            var normY = y0 - centerY;

            var dist = Math.sqrt( normX * normX + normY * normY );
            x0 = centerX + (normX / dist) * (dist + 3);
            y0 = centerY + (normY / dist) * (dist + 3);

            // 
            
            normX = x1 - centerX;
            normY = y1 - centerY;

            dist = Math.sqrt( normX * normX + normY * normY );
            x1 = centerX + (normX / dist) * (dist + 3);
            y1 = centerY + (normY / dist) * (dist + 3);

            normX = x2 - centerX;
            normY = y2 - centerY;

            dist = Math.sqrt( normX * normX + normY * normY );
            x2 = centerX + (normX / dist) * (dist + 3);
            y2 = centerY + (normY / dist) * (dist + 3);

        }

        var u0 = uvs[index] * strip.texture.width,   u1 = uvs[index+2] * strip.texture.width, u2 = uvs[index+4]* strip.texture.width;
        var v0 = uvs[index+1]* strip.texture.height, v1 = uvs[index+3] * strip.texture.height, v2 = uvs[index+5]* strip.texture.height;

        context.save();
        context.beginPath();


        context.moveTo(x0, y0);
        context.lineTo(x1, y1);
        context.lineTo(x2, y2);

        context.closePath();

        context.clip();

        // Compute matrix transform
        var delta = u0*v1 + v0*u2 + u1*v2 - v1*u2 - v0*u1 - u0*v2;
        var deltaA = x0*v1 + v0*x2 + x1*v2 - v1*x2 - v0*x1 - x0*v2;
        var deltaB = u0*x1 + x0*u2 + u1*x2 - x1*u2 - x0*u1 - u0*x2;
        var deltaC = u0*v1*x2 + v0*x1*u2 + x0*u1*v2 - x0*v1*u2 - v0*u1*x2 - u0*x1*v2;
        var deltaD = y0*v1 + v0*y2 + y1*v2 - v1*y2 - v0*y1 - y0*v2;
        var deltaE = u0*y1 + y0*u2 + u1*y2 - y1*u2 - y0*u1 - u0*y2;
        var deltaF = u0*v1*y2 + v0*y1*u2 + y0*u1*v2 - y0*v1*u2 - v0*u1*y2 - u0*y1*v2;

        context.transform(deltaA / delta, deltaD / delta,
                            deltaB / delta, deltaE / delta,
                            deltaC / delta, deltaF / delta);

        context.drawImage(strip.texture.baseTexture.source, 0, 0);
        context.restore();
    }
};

PIXI.Rope = function(texture, points)
{
    PIXI.Strip.call( this, texture );
    this.points = points;

    this.verticies = new PIXI.Float32Array(points.length * 4);
    this.uvs = new PIXI.Float32Array(points.length * 4);

// constructor
PIXI.Rope.prototype = Object.create( PIXI.Strip.prototype );
PIXI.Rope.prototype.constructor = PIXI.Rope;

/*
 * Refreshes 
 *
 * @method refresh
 */
PIXI.Rope.prototype.refresh = function()
{
    var points = this.points;
    if(points.length < 1) return;

    var uvs = this.uvs;

    var lastPoint = points[0];
    var indices = this.indices;
    var colors = this.colors;

    this.count-=0.2;

    uvs[0] = 0;
    uvs[1] = 0;
    uvs[2] = 0;
    uvs[3] = 1;

    colors[0] = 1;
    colors[1] = 1;

    indices[0] = 0;
    indices[1] = 1;

    var total = points.length,
        point, index, amount;

    for (var i = 1; i < total; i++)
    {
        point = points[i];
        index = i * 4;
        // time to do some smart drawing!
        amount = i / (total-1);

        if(i%2)
        {
            uvs[index] = amount;
            uvs[index+1] = 0;

            uvs[index+2] = amount;
            uvs[index+3] = 1;
        }
        else
        {
            uvs[index] = amount;
            uvs[index+1] = 0;

            uvs[index+2] = amount;
            uvs[index+3] = 1;
        }

        index = i * 2;
        colors[index] = 1;
        colors[index+1] = 1;

        index = i * 2;
        indices[index] = index;
        indices[index + 1] = index + 1;

        lastPoint = point;
    }
};

/*
 * Updates the object transform for rendering
 *
 * @method updateTransform
 * @private
 */
PIXI.Rope.prototype.updateTransform = function()
{

    var points = this.points;
    if(points.length < 1)return;

    var lastPoint = points[0];
    var nextPoint;
    var perp = {x:0, y:0};

    this.count-=0.2;

    var verticies = this.verticies;
    var total = points.length,
        point, index, ratio, perpLength, num;

    for (var i = 0; i < total; i++)
    {
        point = points[i];
        index = i * 4;

        if(i < points.length-1)
        {
            nextPoint = points[i+1];
        }
        else
        {
            nextPoint = point;
        }

        perp.y = -(nextPoint.x - lastPoint.x);
        perp.x = nextPoint.y - lastPoint.y;

        ratio = (1 - (i / (total-1))) * 10;

        if(ratio > 1) ratio = 1;

        perpLength = Math.sqrt(perp.x * perp.x + perp.y * perp.y);
        num = this.texture.height / 2; //(20 + Math.abs(Math.sin((i + this.count) * 0.3) * 50) )* ratio;
        perp.x /= perpLength;
        perp.y /= perpLength;

        perp.x *= num;
        perp.y *= num;

        verticies[index] = point.x + perp.x;
        verticies[index+1] = point.y + perp.y;
        verticies[index+2] = point.x - perp.x;
        verticies[index+3] = point.y - perp.y;

        lastPoint = point;
    }

    PIXI.DisplayObjectContainer.prototype.updateTransform.call( this );
};

/**
 A RenderTexture is a special texture that allows any pixi displayObject to be rendered to it.

 __Hint__: All DisplayObjects (exmpl. Sprites) that render on RenderTexture should be preloaded.
 Otherwise black rectangles will be drawn instead.

 RenderTexture takes snapshot of DisplayObject passed to render method. If DisplayObject is passed to render method, position and rotation of it will be ignored. For example:

    var renderTexture = new PIXI.RenderTexture(800, 600);
    var sprite = PIXI.Sprite.fromImage("spinObj_01.png");
    sprite.position.x = 800/2;
    sprite.position.y = 600/2;
    sprite.anchor.x = 0.5;
    sprite.anchor.y = 0.5;
    renderTexture.render(sprite);

 Sprite in this case will be rendered to 0,0 position. To render this sprite at center DisplayObjectContainer should be used:

    var doc = new PIXI.DisplayObjectContainer();
    doc.addChild(sprite);
    renderTexture.render(doc);  // Renders to center of renderTexture

 * @class RenderTexture
 * @extends Texture
 * @constructor
 * @param width {Number} The width of the render texture
 * @param height {Number} The height of the render texture
 * @param scaleMode {Number} Should be one of the PIXI.scaleMode consts
 */
PIXI.RenderTexture = function(width, height, renderer, scaleMode)
{
    PIXI.EventTarget.call( this );

    /**
     * The with of the render texture
     *
     * @property width
     * @type Number
     */
    this.width = width || 100;
    /**
     * The height of the render texture
     *
     * @property height
     * @type Number
     */
    this.height = height || 100;

    /**
     * The framing rectangle of the render texture
     *
     * @property frame
     * @type Rectangle
     */
    this.frame = new PIXI.Rectangle(0, 0, this.width, this.height);

    /**
     * This is the area of the BaseTexture image to actually copy to the Canvas / WebGL when rendering,
     * irrespective of the actual frame size or placement (which can be influenced by trimmed texture atlases)
     *
     * @property crop
     * @type Rectangle
     */
    this.crop = new PIXI.Rectangle(0, 0, this.width, this.height);
    
    /**
     * The base texture object that this texture uses
     *
     * @property baseTexture
     * @type BaseTexture
     */
    this.baseTexture = new PIXI.BaseTexture();
    this.baseTexture.width = this.width;
    this.baseTexture.height = this.height;
    this.baseTexture._glTextures = [];

    this.baseTexture.scaleMode = scaleMode || PIXI.scaleModes.DEFAULT;

    this.baseTexture.hasLoaded = true;

    // each render texture can only belong to one renderer at the moment if its webGL
    this.renderer = renderer || PIXI.defaultRenderer;

    if(this.renderer.type === PIXI.WEBGL_RENDERER)
    {
        var gl = this.renderer.gl;

        this.textureBuffer = new PIXI.FilterTexture(gl, this.width, this.height, this.baseTexture.scaleMode);
        this.baseTexture._glTextures[gl.id] =  this.textureBuffer.texture;

        this.render = this.renderWebGL;
        this.projection = new PIXI.Point(this.width/2 , -this.height/2);
    }
    else
    {
        this.render = this.renderCanvas;
        this.textureBuffer = new PIXI.CanvasBuffer(this.width, this.height);
        this.baseTexture.source = this.textureBuffer.canvas;
    }

    this.valid = true;
    PIXI.Texture.frameUpdates.push(this);


};

PIXI.RenderTexture.prototype = Object.create(PIXI.Texture.prototype);
PIXI.RenderTexture.prototype.constructor = PIXI.RenderTexture;

/**
 * Resize the RenderTexture.
 *
 * @method resize
 * @param width {Number} The width to resize to.
 * @param height {Number} The height to resize to.
 * @param updateBase {Boolean} Should the baseTexture.width and height values be resized as well?
 */
PIXI.RenderTexture.prototype.resize = function(width, height, updateBase)
{
    if (width === this.width && height === this.height)
    {
        return;
    }

    this.width = this.frame.width = this.crop.width = width;
    this.height =  this.frame.height = this.crop.height = height;

    if (updateBase)
    {
        this.baseTexture.width = this.width;
        this.baseTexture.height = this.height;
    }

    if (this.renderer.type === PIXI.WEBGL_RENDERER)
    {
        this.projection.x = this.width / 2;
        this.projection.y = -this.height / 2;
    }
    
    this.textureBuffer.resize(this.width, this.height);
};

/**
 * Clears the RenderTexture.
 *
 * @method clear
 */
PIXI.RenderTexture.prototype.clear = function()
{
    if (this.renderer.type === PIXI.WEBGL_RENDERER)
    {
        this.renderer.gl.bindFramebuffer(this.renderer.gl.FRAMEBUFFER, this.textureBuffer.frameBuffer);
    }
    
    this.textureBuffer.clear();
};

/**
 * This function will draw the display object to the texture.
 *
 * @method renderWebGL
 * @param displayObject {DisplayObject} The display object to render this texture on
 * @param clear {Boolean} If true the texture will be cleared before the displayObject is drawn
 * @private
 */
PIXI.RenderTexture.prototype.renderWebGL = function(displayObject, position, clear)
{
    //TOOD replace position with matrix..
    var gl = this.renderer.gl;

    gl.colorMask(true, true, true, true);

    gl.viewport(0, 0, this.width, this.height);

    gl.bindFramebuffer(gl.FRAMEBUFFER, this.textureBuffer.frameBuffer );

    if(clear)this.textureBuffer.clear();


    // THIS WILL MESS WITH HIT TESTING!
    var children = displayObject.children;

    //TODO -? create a new one??? dont think so!
    var originalWorldTransform = displayObject.worldTransform;
    displayObject.worldTransform = PIXI.RenderTexture.tempMatrix;
    // modify to flip...
    displayObject.worldTransform.d = -1;
    displayObject.worldTransform.ty = this.projection.y * -2;

    if(position)
    {
        displayObject.worldTransform.tx = position.x;
        displayObject.worldTransform.ty -= position.y;
    }

    for(var i=0,j=children.length; i<j; i++)
    {
        children[i].updateTransform();
    }

    // update the textures!
    PIXI.WebGLRenderer.updateTextures();

    this.renderer.spriteBatch.dirty = true;
    
    this.renderer.renderDisplayObject(displayObject, this.projection, this.textureBuffer.frameBuffer);

    displayObject.worldTransform = originalWorldTransform;

    this.renderer.spriteBatch.dirty = true;
};


/**
 * This function will draw the display object to the texture.
 *
 * @method renderCanvas
 * @param displayObject {DisplayObject} The display object to render this texture on
 * @param clear {Boolean} If true the texture will be cleared before the displayObject is drawn
 * @private
 */
PIXI.RenderTexture.prototype.renderCanvas = function(displayObject, position, clear)
{
    var children = displayObject.children;

    var originalWorldTransform = displayObject.worldTransform;

    displayObject.worldTransform = PIXI.RenderTexture.tempMatrix;
    
    if(position)
    {
        displayObject.worldTransform.tx = position.x;
        displayObject.worldTransform.ty = position.y;
    }
    else
    {
        displayObject.worldTransform.tx = 0;
        displayObject.worldTransform.ty = 0;
    }

    for(var i = 0, j = children.length; i < j; i++)
    {
        children[i].updateTransform();
    }

    if(clear)this.textureBuffer.clear();

    var context = this.textureBuffer.context;

    this.renderer.renderDisplayObject(displayObject, context);

    context.setTransform(1,0,0,1,0,0);

    displayObject.worldTransform = originalWorldTransform;
};

PIXI.RenderTexture.tempMatrix = new PIXI.Matrix();

/**
 * A Class that loads a bunch of images / sprite sheet / bitmap font files. Once the
 * assets have been loaded they are added to the PIXI Texture cache and can be accessed
 * easily through PIXI.Texture.fromImage() and PIXI.Sprite.fromImage()
 * When all items have been loaded this class will dispatch a 'onLoaded' event
 * As each individual item is loaded this class will dispatch a 'onProgress' event
 *
 * @class AssetLoader
 * @constructor
 * @uses EventTarget
 * @param {Array<String>} assetURLs an array of image/sprite sheet urls that you would like loaded
 *      supported. Supported image formats include 'jpeg', 'jpg', 'png', 'gif'. Supported
 *      sprite sheet data formats only include 'JSON' at this time. Supported bitmap font
 *      data formats include 'xml' and 'fnt'.
 * @param crossorigin {Boolean} Whether requests should be treated as crossorigin
 */
PIXI.AssetLoader = function(assetURLs, crossorigin)
{
    PIXI.EventTarget.call(this);

    /**
     * The array of asset URLs that are going to be loaded
     *
     * @property assetURLs
     * @type Array<String>
     */
    this.assetURLs = assetURLs;

    /**
     * Whether the requests should be treated as cross origin
     *
     * @property crossorigin
     * @type Boolean
     */
    this.crossorigin = crossorigin;

    /**
     * Maps file extension to loader types
     *
     * @property loadersByType
     * @type Object
     */
    this.loadersByType = {
        'jpg':  PIXI.ImageLoader,
        'jpeg': PIXI.ImageLoader,
        'png':  PIXI.ImageLoader,
        'gif':  PIXI.ImageLoader,
        'webp': PIXI.ImageLoader,
        'json': PIXI.JsonLoader,
        'atlas': PIXI.AtlasLoader,
        'anim': PIXI.SpineLoader,
        'xml':  PIXI.BitmapFontLoader,
        'fnt':  PIXI.BitmapFontLoader
    };
};

/**
 * Fired when an item has loaded
 * @event onProgress
 */

/**
 * Fired when all the assets have loaded
 * @event onComplete
 */

// constructor
PIXI.AssetLoader.prototype.constructor = PIXI.AssetLoader;

/**
 * Given a filename, returns its extension, wil
 *
 * @method _getDataType
 * @param str {String} the name of the asset
 */
PIXI.AssetLoader.prototype._getDataType = function(str)
{
    var test = 'data:';
    //starts with 'data:'
    var start = str.slice(0, test.length).toLowerCase();
    if (start === test) {
        var data = str.slice(test.length);

        var sepIdx = data.indexOf(',');
        if (sepIdx === -1) //malformed data URI scheme
            return null;

        //e.g. 'image/gif;base64' => 'image/gif'
        var info = data.slice(0, sepIdx).split(';')[0];

        //We might need to handle some special cases here...
        //standardize text/plain to 'txt' file extension
        if (!info || info.toLowerCase() === 'text/plain')
            return 'txt';

        //User specified mime type, try splitting it by '/'
        return info.split('/').pop().toLowerCase();
    }

    return null;
};

/**
 * Starts loading the assets sequentially
 *
 * @method load
 */
PIXI.AssetLoader.prototype.load = function()
{
    var scope = this;

    function onLoad(evt) {
        scope.onAssetLoaded(evt.content);
    }

    this.loadCount = this.assetURLs.length;

    for (var i=0; i < this.assetURLs.length; i++)
    {
        var fileName = this.assetURLs[i];
        //first see if we have a data URI scheme..
        var fileType = this._getDataType(fileName);

        //if not, assume it's a file URI
        if (!fileType)
            fileType = fileName.split('?').shift().split('.').pop().toLowerCase();

        var Constructor = this.loadersByType[fileType];
        if(!Constructor)
            throw new Error(fileType + ' is an unsupported file type');

        var loader = new Constructor(fileName, this.crossorigin);

        loader.addEventListener('loaded', onLoad);
        loader.load();
    }
};

/**
 * Invoked after each file is loaded
 *
 * @method onAssetLoaded
 * @private
 */
PIXI.AssetLoader.prototype.onAssetLoaded = function(loader)
{
    this.loadCount--;
    this.dispatchEvent({ type: 'onProgress', content: this, loader: loader });
    if (this.onProgress) this.onProgress(loader);

    if (!this.loadCount)
    {
        this.dispatchEvent({type: 'onComplete', content: this});
        if(this.onComplete) this.onComplete();
    }
};

/**
 * The json file loader is used to load in JSON data and parse it
 * When loaded this class will dispatch a 'loaded' event
 * If loading fails this class will dispatch an 'error' event
 *
 * @class JsonLoader
 * @uses EventTarget
 * @constructor
 * @param url {String} The url of the JSON file
 * @param crossorigin {Boolean} Whether requests should be treated as crossorigin
 */
PIXI.JsonLoader = function (url, crossorigin) {
    PIXI.EventTarget.call(this);

    /**
     * The url of the bitmap font data
     *
     * @property url
     * @type String
     */
    this.url = url;

    /**
     * Whether the requests should be treated as cross origin
     *
     * @property crossorigin
     * @type Boolean
     */
    this.crossorigin = crossorigin;

    /**
     * [read-only] The base url of the bitmap font data
     *
     * @property baseUrl
     * @type String
     * @readOnly
     */
    this.baseUrl = url.replace(/[^\/]*$/, '');

    /**
     * [read-only] Whether the data has loaded yet
     *
     * @property loaded
     * @type Boolean
     * @readOnly
     */
    this.loaded = false;

};

// constructor
PIXI.JsonLoader.prototype.constructor = PIXI.JsonLoader;

/**
 * Loads the JSON data
 *
 * @method load
 */
PIXI.JsonLoader.prototype.load = function () {

    var scope = this;

    if(window.XDomainRequest && scope.crossorigin)
    {
        this.ajaxRequest = new window.XDomainRequest();

        // XDomainRequest has a few querks. Occasionally it will abort requests
        // A way to avoid this is to make sure ALL callbacks are set even if not used
        // More info here: http://stackoverflow.com/questions/15786966/xdomainrequest-aborts-post-on-ie-9
        this.ajaxRequest.timeout = 3000;

        this.ajaxRequest.onerror = function () {
            scope.onError();
        };
           
        this.ajaxRequest.ontimeout = function () {
            scope.onError();
        };

        this.ajaxRequest.onprogress = function() {};

    }
    else if (window.XMLHttpRequest)
    {
        this.ajaxRequest = new window.XMLHttpRequest();
    }
    else
    {
        this.ajaxRequest = new window.ActiveXObject('Microsoft.XMLHTTP');
    }

    

    this.ajaxRequest.onload = function(){

        scope.onJSONLoaded();
    };

    this.ajaxRequest.open('GET',this.url,true);

    this.ajaxRequest.send();
};

/**
 * Invoke when JSON file is loaded
 *
 * @method onJSONLoaded
 * @private
 */
PIXI.JsonLoader.prototype.onJSONLoaded = function () {
    
    if(!this.ajaxRequest.responseText )
    {
        this.onError();
        return;
    }
   
    this.json = JSON.parse(this.ajaxRequest.responseText);

    if(this.json.frames)
    {
        // sprite sheet
        var scope = this;
        var textureUrl = this.baseUrl + this.json.meta.image;
        var image = new PIXI.ImageLoader(textureUrl, this.crossorigin);
        var frameData = this.json.frames;

        this.texture = image.texture.baseTexture;
        image.addEventListener('loaded', function() {
            scope.onLoaded();
        });

        for (var i in frameData)
        {
            var rect = frameData[i].frame;

            if (rect)
            {
                PIXI.TextureCache[i] = new PIXI.Texture(this.texture, {
                    x: rect.x,
                    y: rect.y,
                    width: rect.w,
                    height: rect.h
                });

                PIXI.TextureCache[i].crop = new PIXI.Rectangle(rect.x, rect.y, rect.w, rect.h);

                //  Check to see if the sprite is trimmed
                if (frameData[i].trimmed)
                {
                    var actualSize = frameData[i].sourceSize;
                    var realSize = frameData[i].spriteSourceSize;
                    PIXI.TextureCache[i].trim = new PIXI.Rectangle(realSize.x, realSize.y, actualSize.w, actualSize.h);
                }
            }
        }

        image.load();

    }
    else if(this.json.bones)
    {
        // spine animation
        var spineJsonParser = new spine.SkeletonJson();
        var skeletonData = spineJsonParser.readSkeletonData(this.json);
        PIXI.AnimCache[this.url] = skeletonData;
        this.onLoaded();
    }
    else
    {
        this.onLoaded();
    }
};

/**
 * Invoke when json file loaded
 *
 * @method onLoaded
 * @private
 */
PIXI.JsonLoader.prototype.onLoaded = function () {
    this.loaded = true;
    this.dispatchEvent({
        type: 'loaded',
        content: this
    });
};

/**
 * Invoke when error occured
 *
 * @method onError
 * @private
 */
PIXI.JsonLoader.prototype.onError = function () {

    this.dispatchEvent({
        type: 'error',
        content: this
    });
};

/**
 * The atlas file loader is used to load in Atlas data and parse it
 * When loaded this class will dispatch a 'loaded' event
 * If loading fails this class will dispatch an 'error' event
 * @class AtlasLoader
 * @extends EventTarget
 * @constructor
 * @param {String} url the url of the JSON file
 * @param {Boolean} crossorigin
 */

PIXI.AtlasLoader = function (url, crossorigin) {
    PIXI.EventTarget.call(this);
    this.url = url;
    this.baseUrl = url.replace(/[^\/]*$/, '');
    this.crossorigin = crossorigin;
    this.loaded = false;

};

// constructor
PIXI.AtlasLoader.constructor = PIXI.AtlasLoader;


 /**
 * Starts loading the JSON file
 *
 * @method load
 */
PIXI.AtlasLoader.prototype.load = function () {
    this.ajaxRequest = new PIXI.AjaxRequest();
    this.ajaxRequest.onreadystatechange = this.onAtlasLoaded.bind(this);

    this.ajaxRequest.open('GET', this.url, true);
    if (this.ajaxRequest.overrideMimeType) this.ajaxRequest.overrideMimeType('application/json');
    this.ajaxRequest.send(null);
};

/**
 * Invoke when JSON file is loaded
 * @method onAtlasLoaded
 * @private
 */
PIXI.AtlasLoader.prototype.onAtlasLoaded = function () {
    if (this.ajaxRequest.readyState === 4) {
        if (this.ajaxRequest.status === 200 || window.location.href.indexOf('http') === -1) {
            this.atlas = {
                meta : {
                    image : []
                },
                frames : []
            };
            var result = this.ajaxRequest.responseText.split(/\r?\n/);
            var lineCount = -3;

            var currentImageId = 0;
            var currentFrame = null;
            var nameInNextLine = false;

            var i = 0,
                j = 0,
                selfOnLoaded = this.onLoaded.bind(this);

            // parser without rotation support yet!
            for (i = 0; i < result.length; i++) {
                result[i] = result[i].replace(/^\s+|\s+$/g, '');
                if (result[i] === '') {
                    nameInNextLine = i+1;
                }
                if (result[i].length > 0) {
                    if (nameInNextLine === i) {
                        this.atlas.meta.image.push(result[i]);
                        currentImageId = this.atlas.meta.image.length - 1;
                        this.atlas.frames.push({});
                        lineCount = -3;
                    } else if (lineCount > 0) {
                        if (lineCount % 7 === 1) { // frame name
                            if (currentFrame != null) { //jshint ignore:line
                                this.atlas.frames[currentImageId][currentFrame.name] = currentFrame;
                            }
                            currentFrame = { name: result[i], frame : {} };
                        } else {
                            var text = result[i].split(' ');
                            if (lineCount % 7 === 3) { // position
                                currentFrame.frame.x = Number(text[1].replace(',', ''));
                                currentFrame.frame.y = Number(text[2]);
                            } else if (lineCount % 7 === 4) { // size
                                currentFrame.frame.w = Number(text[1].replace(',', ''));
                                currentFrame.frame.h = Number(text[2]);
                            } else if (lineCount % 7 === 5) { // real size
                                var realSize = {
                                    x : 0,
                                    y : 0,
                                    w : Number(text[1].replace(',', '')),
                                    h : Number(text[2])
                                };

                                if (realSize.w > currentFrame.frame.w || realSize.h > currentFrame.frame.h) {
                                    currentFrame.trimmed = true;
                                    currentFrame.realSize = realSize;
                                } else {
                                    currentFrame.trimmed = false;
                                }
                            }
                        }
                    }
                    lineCount++;
                }
            }

            if (currentFrame != null) { //jshint ignore:line
                this.atlas.frames[currentImageId][currentFrame.name] = currentFrame;
            }

            if (this.atlas.meta.image.length > 0) {
                this.images = [];
                for (j = 0; j < this.atlas.meta.image.length; j++) {
                    // sprite sheet
                    var textureUrl = this.baseUrl + this.atlas.meta.image[j];
                    var frameData = this.atlas.frames[j];
                    this.images.push(new PIXI.ImageLoader(textureUrl, this.crossorigin));

                    for (i in frameData) {
                        var rect = frameData[i].frame;
                        if (rect) {
                            PIXI.TextureCache[i] = new PIXI.Texture(this.images[j].texture.baseTexture, {
                                x: rect.x,
                                y: rect.y,
                                width: rect.w,
                                height: rect.h
                            });
                            if (frameData[i].trimmed) {
                                PIXI.TextureCache[i].realSize = frameData[i].realSize;
                                // trim in pixi not supported yet, todo update trim properties if it is done ...
                                PIXI.TextureCache[i].trim.x = 0;
                                PIXI.TextureCache[i].trim.y = 0;
                            }
                        }
                    }
                }

                this.currentImageId = 0;
                for (j = 0; j < this.images.length; j++) {
                    this.images[j].addEventListener('loaded', selfOnLoaded);
                }
                this.images[this.currentImageId].load();

            } else {
                this.onLoaded();
            }

        } else {
            this.onError();
        }
    }
};

/**
 * Invoke when json file has loaded
 * @method onLoaded
 * @private
 */
PIXI.AtlasLoader.prototype.onLoaded = function () {
    if (this.images.length - 1 > this.currentImageId) {
        this.currentImageId++;
        this.images[this.currentImageId].load();

/**
 * Loads image and split it to uniform sized frames
 *
 *
 * @method loadFramedSpriteSheet
 * @param frameWidth {Number} width of each frame
 * @param frameHeight {Number} height of each frame
 * @param textureName {String} if given, the frames will be cached in <textureName>-<ord> format
 */
PIXI.ImageLoader.prototype.loadFramedSpriteSheet = function(frameWidth, frameHeight, textureName)
{
    this.frames = [];
    var cols = Math.floor(this.texture.width / frameWidth);
    var rows = Math.floor(this.texture.height / frameHeight);

    var i=0;
    for (var y=0; y<rows; y++)
    {
        for (var x=0; x<cols; x++,i++)
        {
            var texture = new PIXI.Texture(this.texture, {
                x: x*frameWidth,
                y: y*frameHeight,
                width: frameWidth,
                height: frameHeight
            });

            this.frames.push(texture);
            if (textureName) PIXI.TextureCache[textureName + '-' + i] = texture;
        }
    }

    if(!this.texture.baseTexture.hasLoaded)
    {
        var scope = this;
        this.texture.baseTexture.addEventListener('loaded', function() {
            scope.onLoaded();
        });
    }
    else
    {
        this.onLoaded();
    }
};

/**
 * Loads the XML font data
 *
 * @method load
 */
PIXI.BitmapFontLoader.prototype.load = function()
{
    this.ajaxRequest = new PIXI.AjaxRequest();
    var scope = this;
    this.ajaxRequest.onreadystatechange = function()
    {
        scope.onXMLLoaded();
    };

    this.ajaxRequest.open('GET', this.url, true);
    if (this.ajaxRequest.overrideMimeType) this.ajaxRequest.overrideMimeType('application/xml');
    this.ajaxRequest.send(null);
};

/**
 * Invoked when the XML file is loaded, parses the data
 *
 * @method onXMLLoaded
 * @private
 */
PIXI.BitmapFontLoader.prototype.onXMLLoaded = function()
{
    if (this.ajaxRequest.readyState === 4)
    {
        if (this.ajaxRequest.status === 200 || window.location.protocol.indexOf('http') === -1)
        {
            var responseXML = this.ajaxRequest.responseXML;
            if(!responseXML || /MSIE 9/i.test(navigator.userAgent) || navigator.isCocoonJS) {
                if(typeof(window.DOMParser) === 'function') {
                    var domparser = new DOMParser();
                    responseXML = domparser.parseFromString(this.ajaxRequest.responseText, 'text/xml');
                } else {
                    var div = document.createElement('div');
                    div.innerHTML = this.ajaxRequest.responseText;
                    responseXML = div;
                }
            }

            var textureUrl = this.baseUrl + responseXML.getElementsByTagName('page')[0].getAttribute('file');
            var image = new PIXI.ImageLoader(textureUrl, this.crossorigin);
            this.texture = image.texture.baseTexture;

            var data = {};
            var info = responseXML.getElementsByTagName('info')[0];
            var common = responseXML.getElementsByTagName('common')[0];
            data.font = info.getAttribute('face');
            data.size = parseInt(info.getAttribute('size'), 10);
            data.lineHeight = parseInt(common.getAttribute('lineHeight'), 10);
            data.chars = {};

            //parse letters
            var letters = responseXML.getElementsByTagName('char');

            for (var i = 0; i < letters.length; i++)
            {
                var charCode = parseInt(letters[i].getAttribute('id'), 10);

                var textureRect = new PIXI.Rectangle(
                    parseInt(letters[i].getAttribute('x'), 10),
                    parseInt(letters[i].getAttribute('y'), 10),
                    parseInt(letters[i].getAttribute('width'), 10),
                    parseInt(letters[i].getAttribute('height'), 10)
                );

                data.chars[charCode] = {
                    xOffset: parseInt(letters[i].getAttribute('xoffset'), 10),
                    yOffset: parseInt(letters[i].getAttribute('yoffset'), 10),
                    xAdvance: parseInt(letters[i].getAttribute('xadvance'), 10),
                    kerning: {},
                    texture: PIXI.TextureCache[charCode] = new PIXI.Texture(this.texture, textureRect)

                };
            }

            //parse kernings
            var kernings = responseXML.getElementsByTagName('kerning');
            for (i = 0; i < kernings.length; i++)
            {
                var first = parseInt(kernings[i].getAttribute('first'), 10);
                var second = parseInt(kernings[i].getAttribute('second'), 10);
                var amount = parseInt(kernings[i].getAttribute('amount'), 10);

                data.chars[second].kerning[first] = amount;

            }

            PIXI.BitmapText.fonts[data.font] = data;

            var scope = this;
            image.addEventListener('loaded', function() {
                scope.onLoaded();
            });
            image.load();
        }
    }
};

{
    this.dispatchEvent({type: 'loaded', content: this});
};

        stoneChestIdx = _sci;
      } else {
        window._dgStoneChestIdx = -1;
        stoneChestIdx = -1;
      }
    } catch(e) { window._dgStoneChestIdx = -1; stoneChestIdx = -1; }
    updatePathfindingForChests();
  }

  function updatePathfindingForChests() {
    var g = game();
    if (!g || !g.map || !g.player || !g.staticSystems || !g.staticSystems.pathfindingSystem) return;
    if (!g.map.tiles) return;
    try {
      if (!g.map._origTypeList) {
        g.map._origTypeList = g.map.typeList.bind(g.map);
        g.map.typeList = function() {
          var grid = g.map._origTypeList();
          for (var i = 0; i < chests.length; i++) {
            if (!chests[i].opened) {
              var cx = chests[i].x, cy = chests[i].y;
              if (grid[cy] && grid[cy][cx] !== undefined) {
                grid[cy][cx] = 0;
              }
            }
          }
          return grid;
        };
      }
      g.staticSystems.pathfindingSystem.initialize();
    } catch(e) {}
  }

  function positionChests() {
    // No-op: chests are PIXI sprites in game world, positioned automatically
  }

  function checkChestOpen() {
    var g = game();
    if (!g || !g.player) return;
    var p = playerTile(g);
    if (!p) return;
    for (var i = 0; i < chests.length; i++) {
      if (chests[i].opened) continue;
      if (chests[i].x === p.x && chests[i].y === p.y) {
        chests[i].opened = true;
        try { sfx('door'); } catch(_e) {} // v120 chest creak
        chests[i].sprite.setTexture(PIXI.Texture.fromImage(CHEST_OPEN_URL));
        updatePathfindingForChests(); // Unblock the tile
        // v116: Stone chest gives Summoning Stone
        if (i === stoneChestIdx) {
          hasSummoningStone = true;
          _wasAdjacentToAltar = false; // v140: reset latch so first altar approach is fresh
          try { showLootToast("The Summoning Stone... it's your key to summoning the Rabbit Lord. The altar awaits.", '#8e44ad', null, 4000); } catch(_e) {} // v120: stone pickup story
          gear.key = 1; // Use key slot for stone
          logMsg('You find the Summoning Stone!');
          showLootToast('Summoning Stone!', '#e74c3c', null, 2000);
          sfx('pickup');
          renderSlots();
        } else {
          openChest();
        }
      }
    }
  }

  function openChest() {
    var roll = Math.random() * 100;
    if (roll < 15) {
      logMsg('The chest is empty.');
      showLootToast('Empty chest');
    } else if (roll < 35) {
      potionCounts.small++;
      logMsg('You find a small potion!');
      showLootToast('Small Potion!');
      sfx('pickup');
    } else if (roll < 55) {
      potionCounts.large++;
      logMsg('You find a large potion!');
      showLootToast('Large Potion!');
      sfx('pickup');
    } else {
      var isEpic = Math.random() < 0.3;
      var tierIdx = isEpic ? 2 : 1;
      var slot = ['weapon', 'shield', 'armor'][Math.floor(Math.random() * 3)];
      var newGear = GEAR_TIERS[slot][tierIdx];
      var current = gear[slot];
      var tierOrder = {basic: 0, rare: 1, epic: 2};
      if (tierOrder[newGear.tier] <= tierOrder[current.tier]) {
        showLootToast(newGear.name + ' (no upgrade)');
      } else {
        gear[slot] = newGear;
        showLootToast(newGear.name + '!');
        sfx('pickup');
        applyGearStats();
      }
    }
    renderSlots();
  }


  // Loot toast: temporary popup in lower right above inventory
  var lootToast = null;
  var toastQueue = [];
  var toastShowing = false;
  function showLootToast(text, color, tag, durMs) { // v129: optional duration
    // v92: Drop ALL combat toasts for 2s after any kill
    // (killing blow's toast often arrives after __dgOnKill)
    try {
      if (tag && tag.type === 'combat' && typeof window._dgLastKill !== 'undefined') {
        if ((Date.now() - window._dgLastKill) < 2000) return;
      }
    } catch(_e) {}
    // If a toast is already showing, queue this one
    if (toastShowing) {
      toastQueue.push({text: text, color: color, tag: tag, durMs: durMs});
      // Limit queue to 3 to avoid buildup
      if (toastQueue.length > 3) toastQueue.shift();
      return;
    }
    toastShowing = true;
    var borderColor = color || '#f1c40f';
    var textColor = color || '#ffe9a8';
    if (!lootToast) {
      lootToast = document.createElement('div');
      document.body.appendChild(lootToast);
    }
    lootToast.style.cssText = 'position:fixed;z-index:20;pointer-events:none;' +
        'right:8px;bottom:70px;max-width:160px;' +
        'background:rgba(20,15,5,0.92);border:2px solid ' + borderColor + ';border-radius:6px;' +
        'color:' + textColor + ';font-size:13px;font-weight:bold;text-align:center;' +
        'padding:8px 10px;transition:opacity 0.5s;';
    lootToast.textContent = text;
    lootToast.style.opacity = '1';
    lootToast.style.display = 'block';
    // Show for 1.2s, then fade and show next in queue
    if (lootToast._timer) clearTimeout(lootToast._timer);
    lootToast._timer = setTimeout(function() {
      lootToast.style.opacity = '0';
      setTimeout(function() {
        lootToast.style.display = 'none';
        toastShowing = false;
        // Show next in queue
        if (toastQueue.length > 0) {
          var next = toastQueue.shift();
          showLootToast(next.text, next.color, next.tag, next.durMs);
        }
      }, 400);
    }, durMs || 1200);
  }

  function clearPotionState() {
    for (var i = 0; i < potions.length; i++) {
      try { potions[i].el.remove(); } catch (e) {}
    }
    potions = [];
    potionCounts = {small: 0, large: 0};
    var _g = game();
    for (var ci = 0; ci < chests.length; ci++) {
      try { if (_g && _g.world) _g.world.removeChild(chests[ci].sprite); } catch(e) {}
    }
    chests = [];
    for (var j = 0; j < potionEls.length; j++) potionEls[j].innerHTML = '';
    updateHp();
  }

  /* ---------- battle log fade ---------- */
  function updateLogFade() {
    try {
      var g = game();
      if (!g || !g.UI || !g.UI.textLog) return;
      var tl = g.UI.textLog;
      if (window._dgIntroHold) { tl.alpha = 1; return; } // v120: hold fade until first move
      var age = Date.now() - (tl.lastMessageTime || 0);
      if (age > LOG_FADE_MS) {
        var a = (typeof tl.alpha === 'number') ? tl.alpha : 1;
        tl.alpha = Math.max(0, a - 0.2);
        if (tl.alpha === 0 && tl.clear) { tl.clear(); }
      } else {
        tl.alpha = 1;
      }
    } catch (e) {}
  }

  /* ---------- movement ---------- */
  // ---- auto-walk state ----
  var walkTimer = null, walkPath = null, walkI = 0, walkMap = null, lastPos = null;

  function stopWalk() {
    if (walkTimer) { clearInterval(walkTimer); walkTimer = null; }
    walkPath = null;
  }

  // Synthesize the exact keydown+keyup pair the game's Keyboard class expects.
  function pressKey(keyCode) {
    try {
      var dn = new KeyboardEvent('keydown', {keyCode: keyCode, which: keyCode, bubbles: true, cancelable: true});
      // Fallback for keyCode (read-only in some browsers)
      Object.defineProperty(dn, 'keyCode', {value: keyCode});
      Object.defineProperty(dn, 'which', {value: keyCode});
      window.dispatchEvent(dn);
      var up = new KeyboardEvent('keyup', {keyCode: keyCode, which: keyCode, bubbles: true, cancelable: true});
      Object.defineProperty(up, 'keyCode', {value: keyCode});
      Object.defineProperty(up, 'which', {value: keyCode});
      window.dispatchEvent(up);
    } catch(e) {
      // Fallback to old method
      var dn2 = new Event('keydown');
      dn2.keyCode = keyCode;
      window.dispatchEvent(dn2);
      var up2 = new Event('keyup');
      up2.keyCode = keyCode;
      window.dispatchEvent(up2);
    }
    sfx('step');
  }

  function playerTile(g) {
    if (!g || !g.player) return null;
    var pc = g.player.getComponent('position');
    return pc ? pc.position : null;
  }

  // Client (screen) coords -> dungeon tile coords.
  function screenToTile(clientX, clientY) {
    var g = game();
    if (!g) return null;
    var c = document.querySelector('#stage canvas');
    if (!c) return null;
    var r = c.getBoundingClientRect();
    if (r.width <= 0 || r.height <= 0) return null;
    var ix = (clientX - r.left) * (INTERNAL_W / r.width);
    var iy = (clientY - r.top) * (INTERNAL_H / r.height);
    var cam = g.world.camera.position; // pixels, top-left of viewport
    var tp = tilePx(g);
    var tx = Math.floor((ix + cam.x) / tp);
    var ty = Math.floor((iy + cam.y) / tp);
    if (tx < 0 || ty < 0 || tx >= g.map.settings.tilesX || ty >= g.map.settings.tilesY) return null;
    return { x: tx, y: ty };
  }

  // Full A* path via the game's own pathfinding system. Returns null when
  // unreachable, [] when already standing on the target tile.
  function findPathTo(g, tx, ty) {
    var pf = g.staticSystems.pathfindingSystem;
    if (!pf || !pf.easystar) return null;
    var result = null, done = false;
    var p = playerTile(g);
    pf.easystar.setAcceptableTiles(WALKABLE);
    try {
      pf.easystar.findPath(p.x, p.y, tx, ty, function (path) { result = path; done = true; });
    } catch (e) {
      return null; // out of grid bounds etc.
    }
    var guard = 0;
    while (!done && guard < 2000) { pf.easystar.calculate(); guard++; }
    return result;
  }

  function keyFor(dx, dy) {
    if (dx === 1 && dy === 0) return 68;   // D: right
    if (dx === -1 && dy === 0) return 65;  // A: left
    if (dx === 0 && dy === 1) return 83;   // S: down
    if (dx === 0 && dy === -1) return 87;  // W: up
    if (dx === 1 && dy === 1) return 67;   // C: down-right
    if (dx === -1 && dy === 1) return 90;  // Z: down-left
    if (dx === 1 && dy === -1) return 69;  // E: up-right
    if (dx === -1 && dy === -1) return 81; // Q: up-left
    return 0;
  }

  function walkTick() {
    var g = game();
    if (!g || !g.isActive || g.map !== walkMap) return stopWalk();
    var p = playerTile(g);
    // No progress since the last step: something is in the way. Stop.
    if (lastPos && p.x === lastPos.x && p.y === lastPos.y) return stopWalk();
    lastPos = { x: p.x, y: p.y };
    while (walkI < walkPath.length && walkPath[walkI].x === p.x && walkPath[walkI].y === p.y) walkI++;
    if (walkI >= walkPath.length) return stopWalk();
    var dx = walkPath[walkI].x - p.x, dy = walkPath[walkI].y - p.y;
    var k = keyFor(dx, dy);
    if (!k) return stopWalk(); // next node no longer adjacent, bail
    pressKey(k);
    updateHp();
    checkPickup();
    try { positionChests(); } catch(e) {}
    try { positionPotions(); } catch(e) {}
  }

  function goTo(clientX, clientY) {
    try { if (window._dgIntroHold) { window._dgIntroHold = false; var _g2 = game(); if (_g2 && _g2.UI && _g2.UI.textLog) _g2.UI.textLog.lastMessageTime = Date.now(); } } catch(_e) {}
    audio();
    var g = game();
    if (!g) return;
    stopWalk();
    var t = screenToTile(clientX, clientY);
    if (!t) return;
    // If target is an unopened chest, temporarily unblock for pathfinding
    var targetChest = null;
    for (var ci = 0; ci < chests.length; ci++) {
      if (!chests[ci].opened && chests[ci].x === t.x && chests[ci].y === t.y) {
        targetChest = chests[ci];
        break;
      }
    }
    var path;
    if (targetChest) {
      targetChest.opened = true; // Temp unblock
      updatePathfindingForChests();
      path = findPathTo(g, t.x, t.y);
      targetChest.opened = false; // Re-block
      updatePathfindingForChests();
    } else {
      path = findPathTo(g, t.x, t.y);
    }
    if (!path || path.length === 0) return;
    walkPath = path; walkI = 1; walkMap = g.map; lastPos = null;
    walkTimer = setInterval(walkTick, STEP_MS);
  }

  // ---- input bindings ----
  // Wheel up shows the big map, wheel down hides it.
  window.addEventListener('scrollUp', hideMap);
  window.addEventListener('scrollDown', showMap);
  window.addEventListener('sideClick', function() {
    if (typeof toggleMinimap === 'function') toggleMinimap();
  });

  var lastTouchAt = 0;
  function onTap(clientX, clientY) {
    audio();
    if (mapOpen) { hideMap(); return; }
    var s = slotAt(clientX, clientY);
    if (s) {
      if (s.kind === 'potion') drink(s.i);
      else if (s.kind === 'equip') describeGear(s.i);
      return;
    }
    // If tap is on cardinally-adjacent tile, move/attack directly (no pathfinding)
    // Diagonals use pathfinding (goTo) to avoid key mapping issues
    var g = game();
    if (g) {
      var t = screenToTile(clientX, clientY);
      var p = playerTile(g);
      if (t && p) {
        var dx = t.x - p.x, dy = t.y - p.y;
        var isCardinal = (Math.abs(dx) + Math.abs(dy) === 1);
        if (isCardinal) {
          var k = keyFor(dx, dy);
          if (k) {
            pressKey(k);
            updateHp();
            checkPickup();
            try { positionChests(); } catch(e) {}
            try { positionPotions(); } catch(e) {}
            return;
          }
        }
      }
    }
    goTo(clientX, clientY);
  }

  document.addEventListener('touchstart', function (e) {
    lastTouchAt = Date.now();
    var t = e.changedTouches[0];
    onTap(t.clientX, t.clientY);
  }, { passive: true });

  document.addEventListener('mousedown', function (e) {
    // The R1 fires a compatibility mousedown right after touchstart; ignore it.
    if (Date.now() - lastTouchAt < 600) return;
    onTap(e.clientX, e.clientY);
  });

  /* desktop fallbacks for testing */
  // Wheel scroll controls big map (R1 also sends scrollUp/scrollDown events)
  document.addEventListener('wheel', function (e) {
    if (Math.abs(e.deltaY) < 5) return;
    if (e.deltaY < 0) hideMap();
    else showMap();
  }, { passive: true });
  // Button single-click toggles minimap; big map is wheel-only
  var minimapVisible = true;
  function toggleMinimap() {
    minimapVisible = !minimapVisible;
    miniCanvas.style.display = minimapVisible ? 'block' : 'none';
  }
  // Button does nothing for now (was: toggle minimap)
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      // Do nothing
    }
  });

  // Keep the health bar fresh (covers enemy turns, traps, etc.)
  setInterval(updateHp, HP_POLL_MS);

  // Potions, slot icons, log fade, minimap, stairs, and map-change cleanup.
  setInterval(function () {
    var g = game();
    if (!g) return;
    setupCombatToast();
    if (g.map !== lastMap) {
      lastMap = g.map;
      if (expectFloorChange) {
        expectFloorChange = false; // climbed: potions carry up the stairs
      } else {
        // Death (or first boot): pack emptied, gear reset (Item 10, 13).
        // v131: DO NOT reset window.__dgFloor here - death restart() already does it.
        // Resetting here can corrupt an in-progress climb if the flag misfires.
        floor = 1;
        won = false;
        winBanner.style.display = 'none';
        clearPotionState();
        // Reset gear to starter kit
        gear.weapon = GEAR_TIERS.weapon[0];
        gear.shield = GEAR_TIERS.shield[0];
        gear.armor = GEAR_TIERS.armor[0];
        gear.key = 0;
        // Start with 1 small + 1 large potion
        potionCounts.small = 1;
        potionCounts.large = 1;
      }
      // Apply gear stats whenever map changes (new game or floor)
      applyGearStats();
      spawnChests();
      // v116: Place altar on floor 5 stairs
      try { placeAltarOnFloor5(); } catch(e) {}
    }
    positionPotions();
    positionChests();
    checkChestOpen();
    renderSlots();
    // The game's own 9-slot bar is wider than the R1 screen; our fixed
    // 2+4 slots replace it.
    try { if (g.UI && g.UI.quickslotBar) g.UI.quickslotBar.visible = false; } catch (e) {}
    try { if (g.UI && g.UI.spellBar) g.UI.spellBar.visible = false; } catch (e) {}
    checkPickup();
    checkExit();
    try { checkQuest(); } catch(e) {}
    updateLogFade();
    drawMinimap();
    if (mapOpen) { floorLabel.textContent = floorText(); drawMap(bigCanvas, BIG_PX); }
  }, POLL_MS);

  updateHp();
  })();
</script>



<script>
/* Canvas stacking fix: move the game canvas inside #stage if it isn't already.
   Skips #mini (the minimap canvas) so the real game canvas is always moved. */
(function () {
  var stage = document.getElementById('stage');
  var tries = 0;
  var iv = setInterval(function () {
    tries++;
    var c = document.querySelector('body > canvas:not(#mini)');
    if (c && stage) { stage.insertBefore(c, stage.firstChild); clearInterval(iv); }
    else if (tries > 100) clearInterval(iv);
  }, 100);
})();
</script>
